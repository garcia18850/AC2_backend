<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Setores</title>
</head>

<body>
    <h1>Lista de Setores</h1>
    <a th:href="@{/setores/novo}">Inserir Novo Setor</a>
    <table border="1">
        <thead>
            <tr>
                <th>ID</th>
                <th>Nome</th>
                <th>Funcionários</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="s : ${setores}">
                <td th:text="${s.id}"></td>
                <td th:text="${s.nome}"></td>
                <td>
                    <span th:if="${not #lists.isEmpty(s.funcionarios)}"
                        th:text="${#strings.listJoin(s.funcionarios.![nome], ', ')}"></span>
                    <span th:if="${#lists.isEmpty(s.funcionarios)}">Nenhum</span>
                </td>
                <td><a th:href="@{/setores/{id}(id=${s.id})}">Detalhes</a></td>
            </tr>
        </tbody>
    </table>
</body>

</html>
