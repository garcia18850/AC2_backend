<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Novo Projeto</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
            background: #f5f5f5;
        }

        .box {
            background: white;
            padding: 20px;
            max-width: 500px;
            margin: auto;
            border: 1px solid #ddd;
        }

        input {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            margin-bottom: 15px;
            box-sizing: border-box;
        }

        .botao {
            padding: 8px 12px;
            background: #ddd;
            border: 1px solid #bbb;
            cursor: pointer;
        }

        a {
            display: inline-block;
            margin-top: 10px;
            color: #000;
            text-decoration: none;
        }

        .erro {
            color: #b00020;
            background: #fdecea;
            border: 1px solid #f5c2c7;
            padding: 10px;
            margin-bottom: 15px;
        }
    </style>
</head>

<body>
    <div class="box">
        <h1>Novo Projeto</h1>

        <div th:if="${errorMessage}" class="erro" th:text="${errorMessage}"></div>

        <form th:action="@{/projetos}" th:object="${projeto}" method="post">
            <label>Descrição:</label>
            <input type="text" th:field="*{descricao}" required>

            <label>Data de Início:</label>
            <input type="date" th:field="*{dataInicio}" required>

            <label>Data de Fim:</label>
            <input type="date" th:field="*{dataFim}" required>

            <button class="botao" type="submit">Salvar</button>
        </form>

        <a th:href="@{/projetos}">Voltar</a>
    </div>
</body>

</html>
