<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Detalhes do Setor</title>
</head>

<body>
    <h1>Detalhes do Setor</h1>

    <p><strong>ID:</strong> <span th:text="${setor.id}"></span></p>
    <p><strong>Nome:</strong> <span th:text="${setor.nome}"></span></p>

    <h2>Funcionários do setor</h2>
    <ul th:if="${not #lists.isEmpty(setor.funcionarios)}">
        <li th:each="funcionario : ${setor.funcionarios}" th:text="${funcionario.nome}"></li>
    </ul>
    <p th:if="${#lists.isEmpty(setor.funcionarios)}">Nenhum funcionário vinculado.</p>

    <a th:href="@{/setores}">Voltar</a>
</body>

</html>
