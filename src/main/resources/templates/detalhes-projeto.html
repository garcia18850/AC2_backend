<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Detalhes do Projeto</title>
</head>

<body>
    <h1>Detalhes do Projeto</h1>

    <p><strong>ID:</strong> <span th:text="${projeto.id}"></span></p>
    <p><strong>Descrição:</strong> <span th:text="${projeto.descricao}"></span></p>
    <p><strong>Data de Início:</strong> <span th:text="${projeto.dataInicio}"></span></p>
    <p><strong>Data de Fim:</strong> <span th:text="${projeto.dataFim}"></span></p>

    <h2>Funcionários vinculados</h2>
    <ul th:if="${not #lists.isEmpty(projeto.funcionarios)}">
        <li th:each="funcionario : ${projeto.funcionarios}" th:text="${funcionario.nome}"></li>
    </ul>
    <p th:if="${#lists.isEmpty(projeto.funcionarios)}">Nenhum funcionário vinculado.</p>

    <a th:href="@{/projetos}">Voltar</a>
</body>

</html>
