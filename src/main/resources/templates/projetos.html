<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Projetos</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
            background: #f5f5f5;
        }

        .box {
            background: white;
            padding: 20px;
            max-width: 900px;
            margin: auto;
            border: 1px solid #ddd;
        }

        h1 {
            margin-bottom: 20px;
        }

        a {
            color: #000;
            text-decoration: none;
        }

        .botao {
            display: inline-block;
            margin-bottom: 15px;
            padding: 8px 12px;
            background: #ddd;
            border: 1px solid #bbb;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th,
        td {
            border: 1px solid #ccc;
            padding: 8px;
            text-align: left;
        }

        .erro {
            color: #b00020;
            background: #fdecea;
            border: 1px solid #f5c2c7;
            padding: 10px;
            margin-bottom: 15px;
        }
    </style>
</head>

<body>
    <div class="box">
        <h1>Projetos</h1>
        <div th:if="${errorMessage}" class="erro" th:text="${errorMessage}"></div>
        <a class="botao" th:href="@{/projetos/novo}">Novo Projeto</a>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Descrição</th>
                    <th>Data Início</th>
                    <th>Data Fim</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody>
                <tr th:if="${#lists.isEmpty(projetos)}">
                    <td colspan="5">Nenhum projeto cadastrado.</td>
                </tr>
                <tr th:each="p : ${projetos}">
                    <td th:text="${p.id}"></td>
                    <td th:text="${p.descricao}"></td>
                    <td th:text="${p.dataInicio}"></td>
                    <td th:text="${p.dataFim}"></td>
                    <td><a th:href="@{/projetos/{id}(id=${p.id})}">Detalhes</a></td>
                </tr>
            </tbody>
        </table>
    </div>
</body>

</html>
